name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_live_tests:
        description: Run tests against the configured Montycat Semantic engine
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Run test suite
        run: uv run --extra test pytest -q --ignore-glob='tests/test_live_*.py'

  package:
    name: Validate release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Python distributions
        run: |
          uv build --clear
          uv build compat/memocat-mcp --out-dir dist

      - name: Validate Python distributions
        run: uv run --with twine twine check dist/*.whl dist/*.tar.gz

      - name: Smoke-test built wheel
        run: uv run --isolated --no-project --with dist/montycat_mcp-*.whl python -c 'import montycat_mcp, memocat_mcp; assert montycat_mcp.__version__ == memocat_mcp.__version__; print(montycat_mcp.__version__)'

      - name: Smoke-test legacy package migration
        run: uv run --isolated --no-project --find-links dist --with dist/memocat_mcp-*.whl python -c 'import montycat_mcp, memocat_mcp; assert montycat_mcp.__version__ == memocat_mcp.__version__; print(montycat_mcp.__version__)'

      - name: Build and validate Claude Desktop extension
        run: ./build_mcpb.sh

      - name: Reject private or build-only files in MCPB
        run: |
          if unzip -Z1 dist/*.mcpb | grep -E '(^|/)(MCPB_SUBMISSION|.*_PLAN|RELEASE_COMMANDS)\.md$|(^|/)uv\.lock$'; then
            echo "Private or build-only files found in MCPB" >&2
            exit 1
          fi

  live-test:
    name: Live engine acceptance tests
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_tests
    runs-on: ubuntu-latest
    environment: live-test
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.13"
          enable-cache: false

      - name: Require live engine credentials
        env:
          MONTYCAT_TEST_URI: ${{ secrets.MONTYCAT_TEST_URI }}
        run: test -n "$MONTYCAT_TEST_URI"

      - name: Run live acceptance suite
        env:
          MONTYCAT_TEST_URI: ${{ secrets.MONTYCAT_TEST_URI }}
        run: uv run --extra test pytest -q tests/test_live_*.py
