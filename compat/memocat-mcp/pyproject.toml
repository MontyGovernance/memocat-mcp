[project]
name = "memocat-mcp"
version = "0.5.0"
description = "Compatibility launcher for Montycat MCP (formerly MemoCat MCP)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "MontyGovernance" }]
dependencies = ["montycat-mcp==0.5.0"]

[project.scripts]
memocat-mcp = "memocat_mcp.server:main"

[project.urls]
Homepage = "https://github.com/MontyGovernance/montycat-mcp"
Repository = "https://github.com/MontyGovernance/montycat-mcp"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["memocat_compat"]
